# Optional: lets you run and deploy from the command line.
#   Local test:  npx wrangler pages dev
#   Deploy:      npx wrangler pages deploy
# Create the KV namespace first:  npx wrangler kv namespace create TIMETABLE
# and paste the id it prints below. Then add the secret:  npx wrangler pages secret put API_TOKEN

name = "timetable"
pages_build_output_dir = "./public"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "TIMETABLE"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"